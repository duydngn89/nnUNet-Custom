# SegFormer3D reference widths/depths, with BTCV's fixed anisotropic patch
# embedding schedule.
model_name: SegFormer3D
model_parameters:
  in_channels: 1
  sr_ratios: [4, 2, 1, 1]
  embed_dims: [32, 64, 160, 256]
  patch_kernel_size: [3, 3, 3, 3]
  patch_stride: [4, 2, 2, 2]
  patch_padding: [3, 1, 1, 1]
  mlp_ratios: [4, 4, 4, 4]
  num_heads: [1, 2, 5, 8]
  depths: [2, 2, 2, 2]
  d_state: [8, 8, 8, 8]
  d_conv: [3, 3, 3, 3]
  expand: [2, 2, 2, 2]
  num_classes: 14
  decoder_dropout: 0.0
  decoder_head_embedding_dim: 256
  deep_supervision: False
